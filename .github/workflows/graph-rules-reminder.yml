# 그래프 코드를 바꾼 PR이 docs/GRAPH_RULES.md를 안 건드렸으면 리마인드 코멘트를 단다.
# 문서를 대신 써주는 게 아니라, 갱신을 까먹는 것만 막는다 (living document 규칙 — GRAPH_RULES.md 첫머리).
name: graph-rules-reminder

on:
  pull_request:
    paths:
      - 'src/features/graph/**'

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: GRAPH_RULES.md 갱신 여부 확인 후 리마인드
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- graph-rules-reminder -->'
          # 이 PR이 GRAPH_RULES.md도 수정했으면 통과
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json files -q '.files[].path' \
            | grep -qx 'docs/GRAPH_RULES.md' && exit 0
          # 이미 리마인드 코멘트가 있으면 중복 방지
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq '.[].body' \
            | grep -q "$marker" && exit 0
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$marker
          ⚠️ 이 PR은 \`src/features/graph/\` 코드를 수정했지만 \`docs/GRAPH_RULES.md\`는 수정하지 않았습니다.

          그래프 **동작**이 바뀌었다면 해당 체크 항목을 같은 브랜치에서 함께 갱신해 주세요 (living document 규칙).
          동작 변경이 없는 리팩터링/스타일 수정이면 이 코멘트는 무시해도 됩니다."
